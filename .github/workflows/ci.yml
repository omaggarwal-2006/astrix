name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and integration tests
        run: npm test
      - name: Smoke check
        run: npm run test:smoke
      - name: Service-worker manifest and doc links
        run: npm run check
